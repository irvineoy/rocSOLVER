source_file_path: &id001
- /root/rocSOLVER/library/src/auxiliary/rocauxiliary_laswp.hpp
- /root/rocSOLVER/library/src/include/ideal_sizes.hpp
- /root/rocSOLVER/library/src/include/lapack_device_functions.hpp
- /root/rocSOLVER/library/src/include/lib_device_helpers.hpp
- /root/rocSOLVER/library/src/include/lib_host_helpers.hpp
- /root/rocSOLVER/library/src/include/lib_macros.hpp
- /root/rocSOLVER/library/src/include/libcommon.hpp
- /root/rocSOLVER/library/src/include/rocsolver_logger.hpp
- /root/rocSOLVER/library/src/include/rocsolver_logvalue.hpp
- /root/rocSOLVER/library/src/include/rocsolver_run_specialized_kernels.hpp
- /root/rocSOLVER/library/src/lapack/roclapack_getf2.cpp
- /root/rocSOLVER/library/src/lapack/roclapack_getf2.hpp
gen_file_path: *id001
target_kernel_functions:
- copy_trans_mat
- getf2_check_singularity
- getf2_iamax
- getf2_npvt_check_singularity
- getf2_permut_init
- laswp_kernel
- rocsolver_getf2_impl
- rocsolver_getf2_template
- rocsolver_laswp_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*GETF2.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f getf2 -r s -m 4096 -n 4096 --lda 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
