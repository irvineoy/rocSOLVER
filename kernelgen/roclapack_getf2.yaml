source_file_path: &id001
- library/src/auxiliary/rocauxiliary_laswp.hpp
- library/src/include/lapack_device_functions.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
- library/src/lapack/roclapack_getf2.cpp
- library/src/lapack/roclapack_getf2.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_getf2_impl
- rocsolver_getf2_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*GETF2.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release/clients/staging/rocsolver-bench -f getf2 -r s -m 4096 -n 4096 --lda 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
