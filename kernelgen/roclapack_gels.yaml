correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*GELS.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f gels -r s -m 4096 -n 4096 --nrhs 4096 --lda 4096 --ldb 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
