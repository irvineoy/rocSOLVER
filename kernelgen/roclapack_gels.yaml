source_file_path: &id001
- library/src/auxiliary/rocauxiliary_ormlq_unmlq.hpp
- library/src/auxiliary/rocauxiliary_ormqr_unmqr.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
- library/src/lapack/roclapack_gelqf.hpp
- library/src/lapack/roclapack_gels.cpp
- library/src/lapack/roclapack_gels.hpp
- library/src/lapack/roclapack_geqrf.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_gelqf_template
- rocsolver_gels_impl
- rocsolver_ormlq_unmlq_template
- rocsolver_geqrf_template
- rocsolver_gels_template
- rocsolver_ormqr_unmqr_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*GELS.*"
performance_command:
- rocprof-compute-rocsolver profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- \
- '  build/release/clients/staging/rocsolver-bench -f gels -r s -m 3000 -n 3000 --lda 3000 --iters 2'
- rocprof-compute-rocsolver analyze --path rocprof_compute_profile -b 2
