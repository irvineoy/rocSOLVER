source_file_path: &id001
- library/src/lapack/roclapack_gelq2.hpp
- library/src/lapack/roclapack_gelqf.hpp
- library/src/lapack/roclapack_gels.cpp
- library/src/lapack/roclapack_gels.hpp
- library/src/lapack/roclapack_geqr2.hpp
- library/src/lapack/roclapack_geqrf.hpp
- library/src/auxiliary/rocauxiliary_lacgv.hpp
- library/src/auxiliary/rocauxiliary_larf.hpp
- library/src/auxiliary/rocauxiliary_larfb.hpp
- library/src/auxiliary/rocauxiliary_larfg.hpp
- library/src/auxiliary/rocauxiliary_larft.hpp
- library/src/auxiliary/rocauxiliary_orm2r_unm2r.hpp
- library/src/auxiliary/rocauxiliary_orml2_unml2.hpp
- library/src/auxiliary/rocauxiliary_ormlq_unmlq.hpp
- library/src/auxiliary/rocauxiliary_ormqr_unmqr.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
gen_file_path: *id001
target_kernel_functions:
- addmatA1
- copymatA1
- gels_set_zero
- larf_left_kernel
- larf_right_kernel
- larf_run_small
- larfg_run_small
- larft_kernel_backward
- larft_kernel_forward
- larft_restore_tri
- larft_set_diag
- larft_set_tri
- rocsolver_gels_template
- rocsolver_ger
- rocsolver_larfb_inverse_template
- rocsolver_larfb_template
- set_taubeta
- set_triangular
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*GELS.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocsolver-bench -f gels -r s -m 1024 -n 1024 --nrhs 1024 --lda 1024 --ldb 1024 --iters 1
- rocprof-compute analyze --path rocprof_compute_profile -b 2
