- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f sygvdj -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
