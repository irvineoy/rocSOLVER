source_file_path: &id001
- library/src/lapack/roclapack_potrf.hpp
- library/src/lapack/roclapack_syevdj_heevdj.hpp
- library/src/lapack/roclapack_sygst_hegst.hpp
- library/src/lapack/roclapack_sygv_hegv.hpp
- library/src/lapack/roclapack_sygvdj_hegvdj.cpp
- library/src/lapack/roclapack_sygvdj_hegvdj.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_sygst_hegst_template
- rocsolver_sygvdj_hegvdj_impl
- rocsolver_sygvdj_hegvdj_template
- rocsolver_syevdj_heevdj_template
- rocsolver_potrf_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*SYGVDJ.*:*HEGVDJ.*"
performance_command:
- rocprof-compute-rocsolver profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- \
- '  build/release/clients/staging/rocsolver-bench -f sygvdj -r s -m 3000 -n 3000 --lda 3000 --iters 2'
- rocprof-compute-rocsolver analyze --path rocprof_compute_profile -b 2
