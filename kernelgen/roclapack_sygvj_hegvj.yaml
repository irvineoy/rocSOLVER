source_file_path: &id001
- library/src/lapack/roclapack_potrf.hpp
- library/src/lapack/roclapack_syevj_heevj.hpp
- library/src/lapack/roclapack_sygst_hegst.hpp
- library/src/lapack/roclapack_sygv_hegv.hpp
- library/src/lapack/roclapack_sygvj_hegvj.cpp
- library/src/lapack/roclapack_sygvj_hegvj.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_sygvj_hegvj_impl
- rocsolver_potrf_template
- rocsolver_syevj_heevj_template
- rocsolver_sygvj_hegvj_template
- rocsolver_sygst_hegst_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*SYGVJ.*:*HEGVJ.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f sygvj -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
