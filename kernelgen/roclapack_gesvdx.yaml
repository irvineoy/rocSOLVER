source_file_path: &id001
- library/src/auxiliary/rocauxiliary_bdsvdx.hpp
- library/src/auxiliary/rocauxiliary_ormbr_unmbr.hpp
- library/src/auxiliary/rocauxiliary_ormlq_unmlq.hpp
- library/src/auxiliary/rocauxiliary_ormqr_unmqr.hpp
- library/src/lapack/roclapack_gebrd.hpp
- library/src/lapack/roclapack_gelqf.hpp
- library/src/lapack/roclapack_geqrf.hpp
- library/src/lapack/roclapack_gesvd.hpp
- library/src/lapack/roclapack_gesvdx.cpp
- library/src/lapack/roclapack_gesvdx.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_gebrd_template
- rocsolver_gesvdx_template
- rocsolver_ormlq_unmlq_template
- rocsolver_bdsvdx_template
- rocsolver_ormbr_unmbr_template
- rocsolver_gesvdx_impl
- rocsolver_ormqr_unmqr_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*GESVDX.*"
performance_command:
- rocprof-compute-rocsolver profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- \
- '  build/release/clients/staging/rocsolver-bench -f gesvdx -r s -m 3000 -n 3000 --lda 3000 --iters 2'
- rocprof-compute-rocsolver analyze --path rocprof_compute_profile -b 2
