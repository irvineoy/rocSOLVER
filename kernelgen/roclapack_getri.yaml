source_file_path: &id001
- library/src/include/lapack_device_functions.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
- library/src/lapack/roclapack_getri.cpp
- library/src/lapack/roclapack_getri.hpp
- library/src/lapack/roclapack_trtri.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_getri_template
- rocsolver_getri_impl
- rocsolver_trtri_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*GETRI.*"
performance_command:
- rocprof-compute-rocsolver profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- \
- '  build/release/clients/staging/rocsolver-bench -f getri -r s -m 3000 -n 3000 --lda 3000 --iters 2'
- rocprof-compute-rocsolver analyze --path rocprof_compute_profile -b 2
