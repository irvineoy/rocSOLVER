source_file_path: &id001
- library/src/auxiliary/rocauxiliary_lacgv.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
- library/src/lapack/roclapack_potf2.cpp
- library/src/lapack/roclapack_potf2.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_potf2_template
- rocsolver_potf2_impl
- rocsolver_lacgv_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*POTF2.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release/clients/staging/rocsolver-bench -f potf2 -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
