source_file_path: &id001
- library/src/lapack/roclapack_potrf.hpp
- library/src/lapack/roclapack_syevd_heevd.hpp
- library/src/lapack/roclapack_sygst_hegst.hpp
- library/src/lapack/roclapack_sygv_hegv.hpp
- library/src/lapack/roclapack_sygvd_hegvd.cpp
- library/src/lapack/roclapack_sygvd_hegvd.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_sygvd_hegvd_template
- rocsolver_potrf_template
- rocsolver_sygvd_hegvd_impl
- rocsolver_sygst_hegst_template
- rocsolver_syevd_heevd_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*SYGVD.*:*HEGVD.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release/clients/staging/rocsolver-bench -f sygvd -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
