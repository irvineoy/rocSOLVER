source_file_path: &id001
- library/src/auxiliary/rocauxiliary_ormtr_unmtr.hpp
- library/src/auxiliary/rocauxiliary_stedc.hpp
- library/src/auxiliary/rocauxiliary_sterf.hpp
- library/src/lapack/roclapack_syev_heev.hpp
- library/src/lapack/roclapack_syevd_heevd.cpp
- library/src/lapack/roclapack_syevd_heevd.hpp
- library/src/lapack/roclapack_sytrd_hetrd.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_ormtr_unmtr_template
- rocsolver_syevd_heevd_impl
- rocsolver_stedc_template
- rocsolver_sytrd_hetrd_template
- rocsolver_syevd_heevd_template
- rocsolver_sterf_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*SYEVD.*:*HEEVD.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release/clients/staging/rocsolver-bench -f syevd -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
