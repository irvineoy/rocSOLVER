kernel_file_path: "library/src/lapack/roclapack_syevd_heevd.cpp"
compile_command: 
  - 'echo "Please make sure you run setup.sh before your compilation"'
  - './install.sh -a gfx942 -c -g -d'
correctness_command: 
  - 'build/release/clients/staging/rocsolver-test --gtest_filter="*SYEVD.*:*HEEVD.*"'
performance_command: 
  - 'rocprof-compute-rocsolver profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- \
    build/release/clients/staging/rocsolver-bench -f syevd -r s -m 3000 -n 3000 --lda 3000 --iters 2'
  - 'rocprof-compute-rocsolver analyze --path rocprof_compute_profile -b 2'

