source_file_path: &id001
- library/src/include/lapack_device_functions.hpp
- library/src/lapack/roclapack_syev_heev.hpp
- library/src/lapack/roclapack_syevj_heevj.cpp
- library/src/lapack/roclapack_syevj_heevj.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_syevj_heevj_impl
- rocsolver_syevj_heevj_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*SYEVJ.*:*HEEVJ.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f syevj -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
