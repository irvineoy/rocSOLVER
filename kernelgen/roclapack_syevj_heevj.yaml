source_file_path: &id001
- library/src/include/lapack_device_functions.hpp
- library/src/lapack/roclapack_syev_heev.hpp
- library/src/lapack/roclapack_syevj_heevj.cpp
- library/src/lapack/roclapack_syevj_heevj.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_syevj_heevj_template
- rocsolver_syevj_heevj_impl
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*SYEVJ.*:*HEEVJ.*"
performance_command:
- rocprof-compute-rocsolver profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- \
- '  build/release/clients/staging/rocsolver-bench -f syevj -r s -m 3000 -n 3000 --lda 3000 --iters 2'
- rocprof-compute-rocsolver analyze --path rocprof_compute_profile -b 2
