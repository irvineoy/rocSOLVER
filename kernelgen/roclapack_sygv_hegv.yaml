source_file_path: &id001
- library/src/lapack/roclapack_potrf.hpp
- library/src/lapack/roclapack_syev_heev.hpp
- library/src/lapack/roclapack_sygst_hegst.hpp
- library/src/lapack/roclapack_sygv_hegv.cpp
- library/src/lapack/roclapack_sygv_hegv.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_potrf_template
- rocsolver_sygst_hegst_template
- rocsolver_syev_heev_template
- rocsolver_sygv_hegv_template
- rocsolver_sygv_hegv_impl
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*SYGV.*:*HEGV.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release/clients/staging/rocsolver-bench -f sygv -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
