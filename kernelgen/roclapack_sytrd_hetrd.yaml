source_file_path: &id001
- library/src/auxiliary/rocauxiliary_latrd.hpp
- library/src/lapack/roclapack_sytd2_hetd2.hpp
- library/src/lapack/roclapack_sytrd_hetrd.cpp
- library/src/lapack/roclapack_sytrd_hetrd.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_sytrd_hetrd_impl
- rocsolver_sytrd_hetrd_template
- rocsolver_latrd_forsytrd_template
- rocsolver_sytd2_hetd2_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*SYTRD.*:*HETRD.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f sytrd -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
