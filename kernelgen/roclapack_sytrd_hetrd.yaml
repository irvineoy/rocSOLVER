source_file_path: &id001
- library/src/auxiliary/rocauxiliary_latrd.hpp
- library/src/lapack/roclapack_sytd2_hetd2.hpp
- library/src/lapack/roclapack_sytrd_hetrd.cpp
- library/src/lapack/roclapack_sytrd_hetrd.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_sytd2_hetd2_template
- rocsolver_sytrd_hetrd_impl
- rocsolver_latrd_forsytrd_template
- rocsolver_sytrd_hetrd_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*SYTRD.*:*HETRD.*"
performance_command:
- rocprof-compute-rocsolver profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- \
- '  build/release/clients/staging/rocsolver-bench -f sytrd -r s -m 3000 -n 3000 --lda 3000 --iters 2'
- rocprof-compute-rocsolver analyze --path rocprof_compute_profile -b 2
