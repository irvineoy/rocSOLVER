source_file_path: &id001
- library/src/lapack/roclapack_potrf.hpp
- library/src/lapack/roclapack_syevx_heevx.hpp
- library/src/lapack/roclapack_sygst_hegst.hpp
- library/src/lapack/roclapack_sygvx_hegvx.cpp
- library/src/lapack/roclapack_sygvx_hegvx.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_syevx_heevx_template
- rocsolver_potrf_template
- rocsolver_sygvx_hegvx_impl
- rocsolver_sygst_hegst_template
- rocsolver_sygvx_hegvx_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*SYGVX.*:*HEGVX.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release/clients/staging/rocsolver-bench -f sygvx -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
