source_file_path: &id001
- library/src/lapack/roclapack_sytf2.hpp
- library/src/lapack/roclapack_sytrf.cpp
- library/src/lapack/roclapack_sytrf.hpp
- library/src/auxiliary/rocauxiliary_lasyf.hpp
- library/src/include/lib_device_helpers.hpp
- library/src/include/lib_host_helpers.hpp
- library/src/include/lib_macros.hpp
- library/src/include/libcommon.hpp
- library/src/include/ideal_sizes.hpp
- library/src/include/rocsolver_logger.hpp
- library/src/include/rocsolver_logvalue.hpp
- library/src/include/lapack_device_functions.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
gen_file_path: *id001
target_kernel_functions:
- lasyf_kernel_lower
- lasyf_kernel_upper
- rocsolver_lasyf_template
- rocsolver_sytf2_template
- rocsolver_sytrf_impl
- rocsolver_sytrf_template
- sytf2_kernel_lower
- sytf2_kernel_upper
- sytrf_kernel_lower
- sytrf_kernel_upper
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*SYTRF.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f sytrf -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
