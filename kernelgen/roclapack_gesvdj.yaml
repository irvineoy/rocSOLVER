source_file_path: &id001
- library/src/auxiliary/rocauxiliary_orglq_unglq.hpp
- library/src/auxiliary/rocauxiliary_orgqr_ungqr.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
- library/src/lapack/roclapack_gelqf.hpp
- library/src/lapack/roclapack_geqrf.hpp
- library/src/lapack/roclapack_gesvdj.cpp
- library/src/lapack/roclapack_gesvdj.hpp
- library/src/lapack/roclapack_syevj_heevj.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_orglq_unglq_template
- rocsolver_syevj_heevj_template
- rocsolver_geqrf_template
- rocsolver_orgqr_ungqr_template
- rocsolver_gelqf_template
- rocsolver_gesvdj_impl
- rocsolver_gesvdj_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*GESVDJ.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release/clients/staging/rocsolver-bench -f gesvdj -r s -m 4096 -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
