source_file_path: &id001
- /root/rocSOLVER/library/src/auxiliary/rocauxiliary_lacgv.hpp
- /root/rocSOLVER/library/src/auxiliary/rocauxiliary_larf.hpp
- /root/rocSOLVER/library/src/auxiliary/rocauxiliary_larfg.hpp
- /root/rocSOLVER/library/src/include/rocsolver_run_specialized_kernels.hpp
- /root/rocSOLVER/library/src/lapack/roclapack_geqr2.cpp
- /root/rocSOLVER/library/src/lapack/roclapack_geqr2.hpp
gen_file_path: *id001
target_kernel_functions:
- conj_in_place
- geqr2_kernel_small
- larf_left_kernel
- larf_right_kernel
- rocsolver_geqr2_impl
- rocsolver_geqr2_template
- rocsolver_lacgv_template
- rocsolver_larf_template
- rocsolver_larfg_template
- set_taubeta
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*GEQR2.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f geqr2 -r s -m 4096 -n 4096 --lda 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
