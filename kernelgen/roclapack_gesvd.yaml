source_file_path: &id001
- library/src/auxiliary/rocauxiliary_bdsqr.hpp
- library/src/auxiliary/rocauxiliary_orgbr_ungbr.hpp
- library/src/auxiliary/rocauxiliary_ormbr_unmbr.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
- library/src/lapack/roclapack_gebrd.hpp
- library/src/lapack/roclapack_gelqf.hpp
- library/src/lapack/roclapack_geqrf.hpp
- library/src/lapack/roclapack_gesvd.cpp
- library/src/lapack/roclapack_gesvd.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_orglq_unglq_template
- rocsolver_gebrd_template
- rocsolver_bdsqr_template
- rocsolver_gelqf_template
- rocsolver_orgqr_ungqr_template
- rocsolver_ormbr_unmbr_template
- rocsolver_orgbr_ungbr_template
- rocsolver_geqrf_template
- rocsolver_gesvd_impl
- rocsolver_gesvd_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*GESVD.*"
performance_command:
- rocprof-compute-rocsolver profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- \
- '  build/release/clients/staging/rocsolver-bench -f gesvd -r s -m 3000 -n 3000 --lda 3000 --iters 2'
- rocprof-compute-rocsolver analyze --path rocprof_compute_profile -b 2
