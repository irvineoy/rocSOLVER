source_file_path: &id001
- library/src/auxiliary/rocauxiliary_ormtr_unmtr.hpp
- library/src/auxiliary/rocauxiliary_stebz.hpp
- library/src/auxiliary/rocauxiliary_stein.hpp
- library/src/lapack/roclapack_syevx_heevx.cpp
- library/src/lapack/roclapack_syevx_heevx.hpp
- library/src/lapack/roclapack_sytrd_hetrd.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_ormtr_unmtr_template
- rocsolver_syevx_heevx_template
- rocsolver_stebz_template
- rocsolver_syevx_heevx_impl
- rocsolver_sytrd_hetrd_template
- rocsolver_stein_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*SYEVX.*:*HEEVX.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release/clients/staging/rocsolver-bench -f syevx -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
