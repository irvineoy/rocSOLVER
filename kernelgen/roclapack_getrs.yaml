source_file_path: &id001
- library/src/lapack/roclapack_getrs.cpp
- library/src/lapack/roclapack_getrs.hpp
- library/src/auxiliary/rocauxiliary_laswp.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
gen_file_path: *id001
target_kernel_functions:
- getf2_run_panel
- getf2_run_small
- getri_run_small
- larf_run_small
- larfg_run_small
- laswp_kernel
- rocsolver_ger
- rocsolver_getrs_template
- rocsolver_laswp_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*GETRS.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocsolver-bench -f getrs -r s -n 1024 --nrhs 1 --lda 1024 --ldb 1024 --iters 1
- rocprof-compute analyze --path rocprof_compute_profile -b 2
