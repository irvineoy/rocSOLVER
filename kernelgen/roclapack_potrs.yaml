source_file_path: &id001
- library/src/lapack/roclapack_potrs.cpp
- library/src/lapack/roclapack_potrs.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_potrs_impl
- rocsolver_potrs_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*POTRS.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocsolver-bench -f potrs -r s -n 1024 --nrhs 1024 --iters 1
- rocprof-compute analyze --path rocprof_compute_profile -b 2
