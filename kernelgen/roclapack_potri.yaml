source_file_path: &id001
- library/src/lapack/roclapack_potri.cpp
- library/src/lapack/roclapack_potri.hpp
- library/src/lapack/roclapack_trtri.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_trtri_template
- rocsolver_potri_template
- rocsolver_potri_impl
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*POTRI.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f potri -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
