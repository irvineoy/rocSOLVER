source_file_path: &id001
- /root/rocSOLVER/library/src/auxiliary/rocauxiliary_lacgv.hpp
- /root/rocSOLVER/library/src/auxiliary/rocauxiliary_larf.hpp
- /root/rocSOLVER/library/src/auxiliary/rocauxiliary_larfg.hpp
- /root/rocSOLVER/library/src/include/rocsolver_run_specialized_kernels.hpp
- /root/rocSOLVER/library/src/lapack/roclapack_gelq2.cpp
- /root/rocSOLVER/library/src/lapack/roclapack_gelq2.hpp
gen_file_path: *id001
target_kernel_functions:
- larf_left_kernel
- larf_right_kernel
- rocsolver_gelq2_impl
- rocsolver_gelq2_template
- set_taubeta
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*GELQ2.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f gelq2 -r s -m 4096 -n 4096 --lda 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
