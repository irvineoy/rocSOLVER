source_file_path: &id001
- library/src/lapack/roclapack_gelq2.cpp
- library/src/lapack/roclapack_gelq2.hpp
- library/src/auxiliary/rocauxiliary_lacgv.hpp
- library/src/auxiliary/rocauxiliary_larf.hpp
- library/src/auxiliary/rocauxiliary_larfg.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
gen_file_path: *id001
target_kernel_functions:
- larf_left_kernel
- larf_right_kernel
- rocsolver_gelq2_impl
- rocsolver_gelq2_template
- set_taubeta
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*GELQ2.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocsolver-bench -f gelq2 -r s -m 1024 -n 1024 --lda 1024 --iters 1
- rocprof-compute analyze --path rocprof_compute_profile -b 2
