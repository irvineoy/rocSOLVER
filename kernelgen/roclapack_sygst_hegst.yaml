source_file_path: &id001
- library/src/include/rocsolver_run_specialized_kernels.hpp
- library/src/lapack/roclapack_sygs2_hegs2.hpp
- library/src/lapack/roclapack_sygst_hegst.cpp
- library/src/lapack/roclapack_sygst_hegst.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_sygst_hegst_template
- rocsolver_sygs2_hegs2_template
- rocsolver_sygst_hegst_impl
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*SYGST.*:*HEGST.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f sygst -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
