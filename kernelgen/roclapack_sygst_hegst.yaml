source_file_path: &id001
- library/src/lapack/roclapack_sygs2_hegs2.hpp
- library/src/lapack/roclapack_sygst_hegst.cpp
- library/src/lapack/roclapack_sygst_hegst.hpp
- library/src/auxiliary/rocauxiliary_lacgv.hpp
- library/src/include/lib_device_helpers.hpp
- library/src/include/lib_host_helpers.hpp
- library/src/include/lib_macros.hpp
- library/src/include/libcommon.hpp
- library/src/include/ideal_sizes.hpp
- library/src/include/rocsolver_logger.hpp
- library/src/include/rocsolver_logvalue.hpp
- library/src/include/lapack_device_functions.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
gen_file_path: *id001
target_kernel_functions:
- larf_run_small
- larfg_run_small
- rocsolver_ger
- rocsolver_sygst_hegst_template
- sygs2_set_diag1
- sygs2_set_diag2
- sygs2_set_diag3
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*SYGST.*:*HEGST.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocsolver-bench -f sygst -r s -n 1024 --iters 1
- rocprof-compute analyze --path rocprof_compute_profile -b 2
