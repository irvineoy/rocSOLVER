source_file_path: &id001
- library/src/lapack/roclapack_geqr2.hpp
- library/src/lapack/roclapack_geqrf.cpp
- library/src/lapack/roclapack_geqrf.hpp
- library/src/auxiliary/rocauxiliary_lacgv.hpp
- library/src/auxiliary/rocauxiliary_larf.hpp
- library/src/auxiliary/rocauxiliary_larfb.hpp
- library/src/auxiliary/rocauxiliary_larfg.hpp
- library/src/auxiliary/rocauxiliary_larft.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
gen_file_path: *id001
target_kernel_functions:
- addmatA1
- copymatA1
- geqr2_kernel_small
- larf_left_kernel
- larf_right_kernel
- larft_kernel_backward
- larft_kernel_forward
- larft_restore_tri
- larft_set_diag
- larft_set_tri
- rocsolver_geqr2_template
- rocsolver_geqrf_impl
- rocsolver_geqrf_template
- rocsolver_larfb_inverse_template
- rocsolver_larfb_template
- rocsolver_larft_inverse_template
- rocsolver_larft_template
- set_taubeta
- set_triangular
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*GEQRF.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f geqrf -r s -m 4096 -n 4096 --lda 4096 --iters 1
- rocprof-compute analyze --path rocprof_compute_profile -b 2
