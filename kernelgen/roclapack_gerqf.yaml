source_file_path: &id001
- library/src/auxiliary/rocauxiliary_larfb.hpp
- library/src/auxiliary/rocauxiliary_larft.hpp
- library/src/lapack/roclapack_gerq2.hpp
- library/src/lapack/roclapack_gerqf.cpp
- library/src/lapack/roclapack_gerqf.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_larfb_template
- rocsolver_gerqf_template
- rocsolver_larft_template
- rocsolver_gerqf_impl
- rocsolver_gerq2_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*GERQF.*"
performance_command:
- rocprof-compute-rocsolver profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- \
- '  build/release/clients/staging/rocsolver-bench -f gerqf -r s -m 3000 -n 3000 --lda 3000 --iters 2'
- rocprof-compute-rocsolver analyze --path rocprof_compute_profile -b 2
