source_file_path: &id001
- library/src/lapack/roclapack_potrf.hpp
- library/src/lapack/roclapack_syevdx_heevdx.hpp
- library/src/lapack/roclapack_sygst_hegst.hpp
- library/src/lapack/roclapack_sygvdx_hegvdx.cpp
- library/src/lapack/roclapack_sygvdx_hegvdx.hpp
- library/src/lapack/roclapack_sygvx_hegvx.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_syevdx_heevdx_template
- rocsolver_potrf_template
- rocsolver_sygst_hegst_template
- rocsolver_sygvdx_hegvdx_template
- rocsolver_sygvdx_hegvdx_impl
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*SYGVDX.*:*HEGVDX.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f sygvdx -r s -n 4096 --lda 4096 --ldb 4096 --ldz 4096 --itype 1 --evect V --erange A --uplo U --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
