- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocsolver-bench -f sygvdx -r s -n 1024 --lda 1024 --ldb 1024 --ldz 1024 --itype 1 --evect V --erange A --uplo U --iters 1
- rocprof-compute analyze --path rocprof_compute_profile -b 2
