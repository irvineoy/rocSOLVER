source_file_path: &id001
- library/src/auxiliary/rocauxiliary_ormtr_unmtr.hpp
- library/src/auxiliary/rocauxiliary_stedcj.hpp
- library/src/lapack/roclapack_syev_heev.hpp
- library/src/lapack/roclapack_syevdj_heevdj.cpp
- library/src/lapack/roclapack_syevdj_heevdj.hpp
- library/src/lapack/roclapack_sytrd_hetrd.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_syevdj_heevdj_impl
- rocsolver_stedcj_template
- rocsolver_ormtr_unmtr_template
- rocsolver_syevdj_heevdj_template
- rocsolver_sytrd_hetrd_template
- rocsolver_syevj_heevj_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*SYEVDJ.*:*HEEVDJ.*"
performance_command:
- rocprof-compute-rocsolver profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- \
- '  build/release/clients/staging/rocsolver-bench -f syevdj -r s -m 3000 -n 3000 --lda 3000 --iters 2'
- rocprof-compute-rocsolver analyze --path rocprof_compute_profile -b 2
