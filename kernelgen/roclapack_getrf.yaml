source_file_path: &id001
- library/src/include/rocsolver_run_specialized_kernels.hpp
- library/src/lapack/roclapack_getf2.hpp
- library/src/lapack/roclapack_getrf.cpp
- library/src/lapack/roclapack_getrf.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_getrf_template
- rocsolver_getrf_impl
- rocsolver_getf2_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*GETRF.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f getrf -r s -m 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
