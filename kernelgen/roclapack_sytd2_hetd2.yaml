source_file_path: &id001
- library/src/lapack/roclapack_sytd2_hetd2.cpp
- library/src/lapack/roclapack_sytd2_hetd2.hpp
- library/src/auxiliary/rocauxiliary_lacgv.hpp
- library/src/auxiliary/rocauxiliary_larfg.hpp
- library/src/auxiliary/rocauxiliary_latrd.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
gen_file_path: *id001
target_kernel_functions:
- latrd_dot_scale_axpy
- latrd_lower_computeW_gemv_kernel
- latrd_lower_computeW_gemvt_kernel
- latrd_lower_computeW_kernel
- latrd_lower_computeW_symv_kernel
- latrd_lower_updateA_kernel
- latrd_lower_updateW_kernel
- latrd_reduce_kernel
- latrd_upper_computeW_gemv_kernel
- latrd_upper_computeW_gemvt_kernel
- latrd_upper_computeW_kernel
- latrd_upper_computeW_symv_kernel
- latrd_upper_updateA_kernel
- latrd_upper_updateW_kernel
- rocsolver_latrd_forsytrd_template
- rocsolver_latrd_template
- rocsolver_sytd2_hetd2_impl
- rocsolver_sytd2_hetd2_template
- set_taubeta
- set_tridiag
- sytd2_lower_kernel_small
- sytd2_upper_kernel_small
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*SYTD2.*:*HETD2.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f sytd2 -r s -n 4096 --iters 1
- rocprof-compute analyze --path rocprof_compute_profile -b 2
