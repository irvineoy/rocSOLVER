source_file_path: &id001
- library/src/auxiliary/rocauxiliary_labrd.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
- library/src/lapack/roclapack_gebd2.hpp
- library/src/lapack/roclapack_gebrd.cpp
- library/src/lapack/roclapack_gebrd.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_labrd_template
- rocsolver_gebrd_impl
- rocsolver_gebrd_template
- rocsolver_gebd2_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*GEBRD.*"
performance_command:
- rocprof-compute-rocsolver profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- \
- '  build/release/clients/staging/rocsolver-bench -f gebrd -r s -m 3000 -n 3000 --lda 3000 --iters 2'
- rocprof-compute-rocsolver analyze --path rocprof_compute_profile -b 2
