source_file_path: &id001
- library/src/lapack/roclapack_geblttrf_npvt.cpp
- library/src/lapack/roclapack_geblttrf_npvt.hpp
- library/src/lapack/roclapack_getf2.hpp
- library/src/lapack/roclapack_getrf.hpp
- library/src/lapack/roclapack_getrs.hpp
- library/src/auxiliary/rocauxiliary_laswp.hpp
- library/src/include/lib_device_helpers.hpp
- library/src/include/lib_host_helpers.hpp
- library/src/include/lib_macros.hpp
- library/src/include/libcommon.hpp
- library/src/include/ideal_sizes.hpp
- library/src/include/rocsolver_logger.hpp
- library/src/include/rocsolver_logvalue.hpp
- library/src/include/lapack_device_functions.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
gen_file_path: *id001
target_kernel_functions:
- geblttrf_update_info
- larf_run_small
- larfg_run_small
- laswp_kernel
- rocsolver_geblttrf_npvt_template
- rocsolver_ger
- rocsolver_laswp_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*GEBLTTRF.*:*NPVT.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocsolver-bench -f geblttrf_npvt -r s --nb 256 --nblocks 16 --lda 256 --ldb 256 --ldc 256 --iters 1
- rocprof-compute analyze --path rocprof_compute_profile -b 2
