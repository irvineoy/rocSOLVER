source_file_path: &id001
- library/src/include/rocsolver_run_specialized_kernels.hpp
- library/src/lapack/roclapack_geblttrf_npvt.cpp
- library/src/lapack/roclapack_geblttrf_npvt.hpp
- library/src/lapack/roclapack_getrf.hpp
- library/src/lapack/roclapack_getrs.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_geblttrf_npvt_impl
- rocsolver_getrs_template
- rocsolver_getrf_template
- rocsolver_geblttrf_npvt_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*GEBLTTRF.*:*NPVT.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f geblttrf_npvt -r s --nb 256 --nblocks 16 --lda 256 --ldb 256 --ldc 256 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
