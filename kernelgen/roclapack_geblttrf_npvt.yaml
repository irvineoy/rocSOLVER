source_file_path: &id001
- library/src/include/rocsolver_run_specialized_kernels.hpp
- library/src/lapack/roclapack_geblttrf_npvt.cpp
- library/src/lapack/roclapack_geblttrf_npvt.hpp
- library/src/lapack/roclapack_getrf.hpp
- library/src/lapack/roclapack_getrs.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_geblttrf_npvt_template
- rocsolver_getrs_template
- rocsolver_geblttrf_npvt_impl
- rocsolver_getrf_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*GEBLTTRF.*:*NPVT.*"
performance_command:
- rocprof-compute-rocsolver profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- \
- '  build/release/clients/staging/rocsolver-bench -f geblttrf -r s -m 3000 -n 3000 --lda 3000 --iters 2'
- rocprof-compute-rocsolver analyze --path rocprof_compute_profile -b 2
