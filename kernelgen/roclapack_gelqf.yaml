source_file_path: &id001
- library/src/auxiliary/rocauxiliary_larfb.hpp
- library/src/auxiliary/rocauxiliary_larft.hpp
- library/src/lapack/roclapack_gelq2.hpp
- library/src/lapack/roclapack_gelqf.cpp
- library/src/lapack/roclapack_gelqf.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_gelqf_impl
- rocsolver_larfb_template
- rocsolver_larft_template
- rocsolver_gelqf_template
- rocsolver_gelq2_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*GELQF.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f gelqf -r s -m 4096 -n 4096 --lda 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
