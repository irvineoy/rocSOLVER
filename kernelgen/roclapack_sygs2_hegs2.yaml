source_file_path: &id001
- /root/rocSOLVER/library/src/lapack/roclapack_sygs2_hegs2.cpp
- /root/rocSOLVER/library/src/lapack/roclapack_sygs2_hegs2.hpp
- /root/rocSOLVER/library/src/auxiliary/rocauxiliary_lacgv.hpp
- /root/rocSOLVER/library/src/include/lib_device_helpers.hpp
- /root/rocSOLVER/library/src/include/lib_host_helpers.hpp
- /root/rocSOLVER/library/src/include/lib_macros.hpp
- /root/rocSOLVER/library/src/include/libcommon.hpp
- /root/rocSOLVER/library/src/include/ideal_sizes.hpp
- /root/rocSOLVER/library/src/include/rocsolver_logger.hpp
- /root/rocSOLVER/library/src/include/rocsolver_logvalue.hpp
- /root/rocSOLVER/library/src/include/lapack_device_functions.hpp
- /root/rocSOLVER/library/src/include/rocsolver_run_specialized_kernels.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_sygs2_hegs2_impl
- rocsolver_sygs2_hegs2_template
- sygs2_set_diag1
- sygs2_set_diag2
- sygs2_set_diag3
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*SYGS2.*:*HEGS2.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f sygs2 -r s -n 4096 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
