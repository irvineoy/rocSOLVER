source_file_path: &id001
- library/src/lapack/roclapack_geblttrs_npvt.cpp
- library/src/lapack/roclapack_geblttrs_npvt.hpp
- library/src/lapack/roclapack_getrs.hpp
- library/src/auxiliary/rocauxiliary_laswp.hpp
- library/src/include/rocsolver_run_specialized_kernels.hpp
gen_file_path: *id001
target_kernel_functions:
- larf_run_small
- larfg_run_small
- laswp_kernel
- rocsolver_geblttrs_npvt_template
- rocsolver_ger
- rocsolver_laswp_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*GEBLTTRS.*:*NPVT.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocsolver-bench -f geblttrs_npvt -r s --nb 256 --nblocks 16 --nrhs 1 --lda 256 --ldb 256 --ldc 256 --ldx 1024 --iters 1
- rocprof-compute analyze --path rocprof_compute_profile -b 2
