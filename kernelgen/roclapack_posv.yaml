source_file_path: &id001
- /root/rocSOLVER/library/src/auxiliary/rocauxiliary_lacgv.hpp
- /root/rocSOLVER/library/src/include/rocsolver_run_specialized_kernels.hpp
- /root/rocSOLVER/library/src/lapack/roclapack_posv.cpp
- /root/rocSOLVER/library/src/lapack/roclapack_posv.hpp
- /root/rocSOLVER/library/src/lapack/roclapack_potf2.hpp
- /root/rocSOLVER/library/src/lapack/roclapack_potrf.hpp
- /root/rocSOLVER/library/src/lapack/roclapack_potrs.hpp
gen_file_path: *id001
target_kernel_functions:
- chk_positive
- rocsolver_posv_impl
- rocsolver_posv_template
- rocsolver_potf2_template
- rocsolver_potrf_template
- rocsolver_potrs_template
- sqrtDiagOnward
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocsolver-test --gtest_filter="*POSV.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- build/release-debug/clients/staging/rocsolver-bench -f posv -r s -n 4096 --nrhs 1 --iters 3
- rocprof-compute analyze --path rocprof_compute_profile -b 2
