source_file_path: &id001
- library/src/lapack/roclapack_posv.cpp
- library/src/lapack/roclapack_posv.hpp
- library/src/lapack/roclapack_potrf.hpp
- library/src/lapack/roclapack_potrs.hpp
gen_file_path: *id001
target_kernel_functions:
- rocsolver_posv_template
- rocsolver_potrs_template
- rocsolver_posv_impl
- rocsolver_potrf_template
compile_command:
- ./install.sh -a gfx942 -c -g -d
correctness_command:
- build/release/clients/staging/rocsolver-test --gtest_filter="*POSV.*"
performance_command:
- rocprof-compute-rocsolver profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -- \
- '  build/release/clients/staging/rocsolver-bench -f posv -r s -m 3000 -n 3000 --lda 3000 --iters 2'
- rocprof-compute-rocsolver analyze --path rocprof_compute_profile -b 2
